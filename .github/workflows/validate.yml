name: Validate Skills

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run skill validation
      shell: pwsh
      run: |
        ./scripts/validate-skills.ps1
